  <rect x="19" y="10" width="4" height="3" fill="#f2f2f3"/>
  <rect x="12" y="13" width="11" height="4" fill="#f2f2f3"/>
  <!-- perna -->
  <path d="M15 17h4l5 9h-4z" fill="#f2f2f3"/>
